# Render Blueprint: one click → AutoFIRC server + dashboard.
# Postgres and Key Value (Valkey 8) are provisioned by this blueprint;
# object storage stays on Supabase (free tier) — provide its connection
# strings as environment variables below.
services:
  # Job queue (apalis). Upstash's free tier caps requests/month and apalis
  # polling exhausts it, so the queue lives on Render Key Value instead.
  - type: keyvalue
    name: autofirc-kv
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: autofirc-server
    runtime: rust
    plan: free
    buildCommand: cargo build --release -p autofirc-server
    startCommand: ./target/release/autofirc-server
    healthCheckPath: /api/ledger
    envVars:
      - key: BIND_ADDR
        value: 0.0.0.0:10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autofirc-kv
          property: connectionString
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: eu-west-1
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_PROVIDER
        value: nebius
      - key: NEBIUS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DGFT_BASE_URL
        value: https://autofirc-mock-dgft.onrender.com # companion mock below; swap for the real DGFT Open API in production
      - key: DGFT_PORTAL_MODE
        value: browser # file eBRCs via the kernel.sh cloud browser driving the mock portal UI
      - key: KERNEL_API_KEY
        sync: false
      - key: ZAPIER_MCP_URL
        sync: false
      - key: RUST_LOG
        value: info

  # Companion mock DGFT so the hosted demo reconciles end-to-end without
  # IEC whitelisting on the real DGFT Open API.
  - type: web
    name: autofirc-mock-dgft
    runtime: rust
    plan: free
    buildCommand: cargo build --release -p autofirc-dgft
    startCommand: ./target/release/mock-dgft
    envVars:
      - key: MOCK_DGFT_ADDR
        value: 0.0.0.0:10000

  - type: web
    env: static
    name: autofirc-dashboard
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        value: https://autofirc-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
